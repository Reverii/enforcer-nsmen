name = "enforcer-nsmen"
main = "src/index.js"
compatibility_date = "2025-09-06"

# Replace the database_id placeholder after running:
#   npx wrangler d1 create enforcer-nsmen
[[d1_databases]]
binding = "DB"
database_name = "enforcer-nsmen"
database_id = "1db69a4a-edd2-4079-9cd1-f61e132cb8d9"
migrations_dir = "migrations"

[vars]
# Your GitHub Pages origin (no trailing slash), e.g. "https://yourunit.github.io"
ALLOWED_ORIGIN = "https://reverii.github.io"
# Full Mini App page URL for the "Open" button in SAF100 bot messages
APP_URL = "https://reverii.github.io/enforcer-nsmen/"
# HIGHEST_ADMIN_TG_ID (the Highest Admin's Telegram user ID) is stored as a secret so it stays out of
# this public repo. Set it with:  npx wrangler secret put HIGHEST_ADMIN_TG_ID --config worker/wrangler.toml
# It is used only while no admin is stored in D1.

# Secret (set via CLI, never put it in this file):
#   npx wrangler secret put BOT_TOKEN --config worker/wrangler.toml
